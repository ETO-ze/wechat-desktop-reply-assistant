name: Offline safety tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run mocked regression tests (no GUI, network or credentials)
        run: python -m unittest discover -s tests -v
      - name: Compile application syntax
        run: python -m py_compile wechat_auto_bot_single_v6_stable_resend.py
